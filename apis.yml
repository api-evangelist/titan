description: Titan (Titan Global Capital Management USA LLC) is a New York City wealth-management firm
  founded in 2017 that offers app-based investing and advisory services to high-performing professionals
  and emerging high-net-worth individuals. Its product suite spans actively managed Flagship, Smart Treasury
  and Opportunities funds, direct indexing, automated stocks and bonds, venture-fund access, credit and
  real-estate strategies, crypto, and dedicated CFP-led wealth advisory, managing over $1.2 billion for
  10,000+ clients. Titan is a consumer fintech application delivered via web and mobile apps; it does not
  publish a public developer API, developer portal, or API documentation. This profile was surfaced as a
  portfolio company of a16z, accel, and general-catalyst.
